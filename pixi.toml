[workspace]
#channels = ["https://prefix.dev/conda-forge"]
channels = ["conda-forge"]
name = "pytorch-pypi"
platforms = ["linux-64"]


[dependencies]
# We need a python version that is compatible with pytorch
python = ">=3.10,<3.11"

[pypi-options]
#no-build-isolation = ["legacy-package"]
extra-index-urls = ["https://download.pytorch.org/whl/cu132"]
[pypi-dependencies]
torch = {version = "==2.13.0"}
torchvision = {version = ">=0.26.0"}
ultralytics = ">=8.4"
pip = ">=26.0.1, <27"
setuptools = "<82.0" #only for installing tinycuda-nn
nerfstudio = { path = "/home/airlab/nerfstudio", editable = true }
