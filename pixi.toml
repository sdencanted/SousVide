figs = { path = "/home/airlab/SousVide/FiGS", editable = true }
gdown = ">=5.2.1, <6"
sousvide = { path = "/home/airlab/SousVide/" , editable = true }
transformers = ">=5.3.0, <6"
dijkstra3d = ">=1.15.2, <2"
